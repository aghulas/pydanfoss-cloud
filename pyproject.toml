[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydanfoss-cloud"
version = "0.8.0"
description = "Pure-Python Danfoss Ally Cloud (path 1a), local Zigbee tunnel, Zigbee2MQTT dialect contract, standalone danfoss2mqtt bridge daemon, and room coordinator."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aghulas" }]
keywords = ["danfoss", "ally", "thermostat", "zigbee", "tuya", "mqtt", "home-assistant", "heating"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = ["pycryptodome>=3.20", "requests>=2.31"]

[project.optional-dependencies]
local = ["tinytuya>=1.15"]
mqtt = ["paho-mqtt>=1.6.1,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/aghulas/pydanfoss-cloud"
Repository = "https://github.com/aghulas/pydanfoss-cloud"
Issues = "https://github.com/aghulas/pydanfoss-cloud/issues"

[project.scripts]
danfoss2mqtt = "pydanfoss_cloud.bridge_daemon:main"
danfoss-room-coordinator = "pydanfoss_cloud.room_coordinator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "FURB"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
  "Crypto.*",
  "tinytuya",
  "paho",
  "paho.*",
  "certifi",
  "requests",
  "requests.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
testpaths = ["tests"]
